name: Temporary PR 18 formatting repair
on:
  push:
    branches: [fix/dutch-email-settings]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openresto-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json
      - run: npm ci
      - name: Generate formatting patch
        run: |
          npx prettier --write api/admin.ts components/admin/settings/EmailSettingsCard.tsx components/admin/settings/EmbedSnippetCard.tsx hooks/use-email-settings.ts tests/components/admin/settings/EmbedSnippetCard.test.tsx
          git diff --no-ext-diff
          npx prettier --check "**/*.{ts,tsx,js,json}"
